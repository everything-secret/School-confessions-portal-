<!-- public/index.html -->
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>School Confession Portal</title>
    <style>
      body {
        font-family: sans-serif;
        max-width: 600px;
        margin: 2rem auto;
        padding: 0 1rem;
      }
      textarea {
        width: 100%;
        height: 100px;
        margin-bottom: 1rem;
      }
      .admin-panel {
        display: none;
      }
    </style>
  </head>
  <body>
    <h1>School Confession Portal</h1>
    <textarea id="confessionText" placeholder="Write your confession..."></textarea>
    <button onclick="submitConfession()">Submit</button>

    <hr />
    <button onclick="showLogin()">Admin Login</button>

    <div id="loginForm" style="display:none;">
      <input type="password" id="adminPassword" placeholder="Password" />
      <button onclick="login()">Login</button>
    </div>

    <div id="adminPanel" class="admin-panel">
      <h2>Admin Panel</h2>
      <ul id="confessionList"></ul>
    </div>

    <script>
      async function submitConfession() {
        const text = document.getElementById("confessionText").value;
        await fetch("/api/confessions", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ text }),
        });
        alert("Confession submitted!");
      }

      function showLogin() {
        document.getElementById("loginForm").style.display = "block";
      }

      async function login() {
        const password = document.getElementById("adminPassword").value;
        const res = await fetch("/api/admin/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });
        if ((await res.json()).success) {
          document.getElementById("adminPanel").style.display = "block";
          loadConfessions();
        } else {
          alert("Wrong password!");
        }
      }

      async function loadConfessions() {
        const res = await fetch("/api/admin/confessions");
        const confessions = await res.json();
        const list = document.getElementById("confessionList");
        list.innerHTML = confessions
          .map((c) => `<li>${c.text} [${c.status}]</li>`)
          .join("");
      }
    </script>
  </body>
</html>
